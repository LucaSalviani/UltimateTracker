# Compila la app de Android y la publica en Releases como "android-beta".
name: Android

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'src/core/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Qt 6.8 de escritorio (hace falta para compilar la de Android)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}/qt
          cache: true
          cache-key-prefix: qt-host
          set-env: false

      - name: Qt 6.8 para Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: android
          arch: android_arm64_v8a
          dir: ${{ runner.temp }}/qt
          cache: true
          cache-key-prefix: qt-android

      - name: NDK, SDK y Ninja
        run: |
          sudo apt-get install -y -q ninja-build > /dev/null
          # OpenSSL de KDAB (mantiene Qt), fijado a un commit concreto
          git clone -q https://github.com/KDAB/android_openssl.git "$RUNNER_TEMP/android_openssl"
          git -C "$RUNNER_TEMP/android_openssl" checkout -q b71f1470962019bd89534a2919f5925f93bc5779
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # Llave para firmar el APK: siempre la misma, así cada versión se instala arriba de
      # la anterior. Si hay secretos ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS se usan
      # esos; si no, se genera una la primera vez y se guarda en la caché de Actions.
      - name: Llave de firma (caché)
        uses: actions/cache@v4
        with:
          path: ~/ut-keystore
          key: ut-keystore-v1

      - name: Llave de firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          mkdir -p ~/ut-keystore
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/ut-keystore/ut.keystore
            printf '%s' "$KS_PASS" > ~/ut-keystore/pass
          elif [ ! -f ~/ut-keystore/ut.keystore ]; then
            openssl rand -hex 16 > ~/ut-keystore/pass
            keytool -genkeypair -keystore ~/ut-keystore/ut.keystore -alias ut -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$(cat ~/ut-keystore/pass)" -keypass "$(cat ~/ut-keystore/pass)" \
              -dname "CN=UltimateTracker, O=Luca Salviani, C=AR"
          fi
          PASS=$(cat ~/ut-keystore/pass)
          echo "::add-mask::$PASS"
          echo "QT_ANDROID_KEYSTORE_PATH=$HOME/ut-keystore/ut.keystore" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_ALIAS=ut" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$PASS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Compilar el APK
        run: |
          QT_ANDROID="${{ runner.temp }}/qt/Qt/6.8.3/android_arm64_v8a"
          QT_HOST="${{ runner.temp }}/qt/Qt/6.8.3/gcc_64"
          "$QT_ANDROID/bin/qt-cmake" -S mobile -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125" \
            -DQT_ANDROID_SIGN_APK=ON \
            -DANDROID_OPENSSL_ROOT="$RUNNER_TEMP/android_openssl"
          cmake --build build --target apk
          find build -name "*.apk" -print
          APK=$(find build -name "*.apk" | grep -i signed | head -1)
          [ -z "$APK" ] && APK=$(find build -name "*release*.apk" | head -1)
          cp "$APK" UltimateTracker-android.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-beta
          name: UltimateTracker para Android (beta)
          prerelease: true
          make_latest: false
          files: UltimateTracker-android.apk
          body: |
            Versión de prueba para Android (Samsung Galaxy y otros, Android 9 o más nuevo).

            **Instalar:** abrí este enlace desde el celu, bajá `UltimateTracker-android.apk` y tocalo. Si Android pregunta, permití "instalar apps de esta fuente". Las versiones nuevas se instalan arriba de la anterior sin perder datos.

            Compilada automáticamente desde `${{ github.sha }}`.
